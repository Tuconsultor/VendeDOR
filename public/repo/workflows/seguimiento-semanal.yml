name: Recordatorio de pipeline
on:
  workflow_dispatch:
  # Activa el horario solo después de probar la ejecución manual. UTC todo el año.
  # schedule:
  #   - cron: '0 15 * * 1'
permissions:
  contents: read
  issues: write
concurrency:
  group: sales-integrations
  cancel-in-progress: false
jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node public/repo/scripts/review.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
