name: Enriquecimiento de prospectos
on:
  workflow_dispatch:
  # Activa el horario solo después de validar con una hoja de prueba. UTC todo el año.
  # schedule:
  #   - cron: '0 14 * * 1-5'
permissions:
  contents: read
concurrency:
  group: sales-integrations
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Exigir un repositorio privado para datos comerciales
        if: ${{ !github.event.repository.private }}
        run: |
          echo "Instala esta automatización en un repositorio privado. Consulta la guía."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar conexiones y enriquecer
        working-directory: public/repo
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
          BUSINESS_CONTEXT: ${{ vars.BUSINESS_CONTEXT }}
          MAX_PROSPECTS: '10'
        run: |
          node scripts/sales.mjs check
          node scripts/sales.mjs enrich
      - name: Guardar justificaciones si hubo resultados
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/repo/output/enrichment.json
          if-no-files-found: ignore
          retention-days: 7
