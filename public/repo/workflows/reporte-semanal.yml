name: Informe de situación del pipeline
on:
  workflow_dispatch:
  # Activa el horario solo después de validar con datos ficticios. UTC todo el año.
  # schedule:
  #   - cron: '0 21 * * 5'
permissions:
  contents: read
concurrency:
  group: sales-integrations
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Exigir un repositorio privado para datos comerciales
        if: ${{ !github.event.repository.private }}
        run: |
          echo "Instala esta automatización en un repositorio privado. Consulta la guía."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar conexiones y generar informe
        working-directory: public/repo
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_REPORT_DOC_ID: ${{ secrets.GOOGLE_REPORT_DOC_ID }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
          BUSINESS_CONTEXT: ${{ vars.BUSINESS_CONTEXT }}
        run: |
          node scripts/sales.mjs check
          node scripts/sales.mjs report
      - name: Guardar informe y métricas
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/repo/output/
          if-no-files-found: error
          retention-days: 7
